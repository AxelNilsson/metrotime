[package]
edition      = "2024"
name         = "metrotimes3"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "metrotimes3"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32s3", "unstable", "psram"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }

embassy-net = { version = "0.7.1", features = [
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
reqwless = { version = "0.13.0", default-features = false, features = [
  "alloc",
  "embedded-tls",
] }
esp-alloc = "0.9.0"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.9.1", features = [] }
embassy-time = "0.5.0"
embassy-sync = "0.7.2"
esp-radio = { version = "0.17.0", features = [
  "esp-alloc",
  "esp32s3",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
log = "0.4"
heapless = "0.8.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

# LED Matrix display
esp-hub75 = { git = "https://github.com/liebman/esp-hub75", branch = "main", features = ["esp32s3", "log"] }
hub75-framebuffer = "0.6.0"
embedded-graphics = "0.8"

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
